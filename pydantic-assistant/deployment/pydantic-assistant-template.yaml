apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: pydantic-assistant
  annotations:
    openshift.io/display-name: "Pydantic Assistant"
    description: >-
      Flask + Pydantic AI assistant combining interactive Chat and autonomous
      Batch modes. Deploys the app, service, route, and persistent storage.
      No cluster authentication is enforced — anyone who can reach the Route
      can use the app. For an OAuth-protected deployment, use the
      "Pydantic Assistant (OAuth)" template instead.
    openshift.io/provider-display-name: "RH Workshop"
    iconClass: icon-python
    tags: "pydantic,agent,workshop"
objects:
  - apiVersion: v1
    kind: Secret
    metadata:
      name: ${APP_NAME}-api-keys
      labels:
        app: ${APP_NAME}
    type: Opaque
    stringData:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}

  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: ${APP_NAME}-agent-pvc
      labels:
        app: ${APP_NAME}
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: ${AGENT_STORAGE_SIZE}

  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: ${APP_NAME}-input-pvc
      labels:
        app: ${APP_NAME}
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: ${INPUT_STORAGE_SIZE}

  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: ${APP_NAME}-output-pvc
      labels:
        app: ${APP_NAME}
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: ${OUTPUT_STORAGE_SIZE}

  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: ${APP_NAME}
      labels:
        app: ${APP_NAME}
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: ${APP_NAME}
      template:
        metadata:
          labels:
            app: ${APP_NAME}
        spec:
          containers:
            - name: ${APP_NAME}
              image: ${IMAGE_NAME}
              ports:
                - containerPort: ${{PORT}}
                  protocol: TCP
              envFrom:
                - secretRef:
                    name: ${APP_NAME}-api-keys
              env:
                - name: API_PROVIDER
                  value: ${API_PROVIDER}
                - name: MODEL
                  value: ${MODEL}
                - name: MAX_TURNS
                  value: ${MAX_TURNS}
                - name: MAX_OUTPUT_TOKENS
                  value: ${MAX_OUTPUT_TOKENS}
                - name: ALLOW_SHELL
                  value: ${ALLOW_SHELL}
                - name: SHELL_TIMEOUT
                  value: "60"
                - name: PORT
                  value: ${PORT}
                - name: HOST
                  value: "0.0.0.0"
              volumeMounts:
                - name: agent-volume
                  mountPath: /app/agent
                - name: input-volume
                  mountPath: /app/input
                - name: output-volume
                  mountPath: /app/output
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              livenessProbe:
                httpGet:
                  path: /
                  port: ${{PORT}}
                initialDelaySeconds: 15
                periodSeconds: 30
                failureThreshold: 3
              readinessProbe:
                httpGet:
                  path: /
                  port: ${{PORT}}
                initialDelaySeconds: 5
                periodSeconds: 10
          volumes:
            - name: agent-volume
              persistentVolumeClaim:
                claimName: ${APP_NAME}-agent-pvc
            - name: input-volume
              persistentVolumeClaim:
                claimName: ${APP_NAME}-input-pvc
            - name: output-volume
              persistentVolumeClaim:
                claimName: ${APP_NAME}-output-pvc

  - apiVersion: v1
    kind: Service
    metadata:
      name: ${APP_NAME}
      labels:
        app: ${APP_NAME}
    spec:
      selector:
        app: ${APP_NAME}
      ports:
        - name: http
          port: ${{PORT}}
          targetPort: ${{PORT}}
          protocol: TCP

  - apiVersion: route.openshift.io/v1
    kind: Route
    metadata:
      name: ${APP_NAME}
      labels:
        app: ${APP_NAME}
    spec:
      to:
        kind: Service
        name: ${APP_NAME}
        weight: 100
      port:
        targetPort: http
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect

parameters:
  - name: APP_NAME
    displayName: Application name
    description: Name used as the prefix for all created resources.
    value: pydantic-assistant
    required: true

  - name: IMAGE_NAME
    displayName: Container image
    description: Full pullspec of the image to deploy.
    value: quay.io/kenghua_yeo/pydantic-assistant:v1
    required: true

  - name: PORT
    displayName: Application port
    value: "8081"
    required: true

  - name: API_PROVIDER
    displayName: AI provider
    description: "One of: anthropic, openai, openrouter, openai-compatible."
    value: openai-compatible
    required: true

  - name: MODEL
    displayName: Model name
    value: llama3.2
    required: true

  - name: MAX_TURNS
    displayName: Max tool-call turns per run (batch loop guard)
    value: "50"
    required: true

  - name: MAX_OUTPUT_TOKENS
    displayName: Max output tokens per model response
    value: "16384"
    required: true

  - name: ALLOW_SHELL
    displayName: Allow the agent to run shell commands
    description: "true or false. Defaults to false for self-service deployments."
    value: "false"
    required: true

  - name: AGENT_STORAGE_SIZE
    displayName: Agent volume size
    value: 1Gi
    required: true

  - name: INPUT_STORAGE_SIZE
    displayName: Input volume size
    value: 5Gi
    required: true

  - name: OUTPUT_STORAGE_SIZE
    displayName: Output volume size
    value: 5Gi
    required: true

  - name: ANTHROPIC_API_KEY
    displayName: Anthropic API key
    description: Only required if API_PROVIDER=anthropic.

  - name: OPENAI_API_KEY
    displayName: OpenAI API key
    description: Only required if API_PROVIDER=openai.

  - name: OPENROUTER_API_KEY
    displayName: OpenRouter API key
    description: Only required if API_PROVIDER=openrouter.

  - name: OPENAI_BASE_URL
    displayName: OpenAI-compatible base URL
    description: Used when API_PROVIDER=openai-compatible (e.g. a local Ollama/vLLM endpoint). No key required for this provider.
    value: "http://localhost:11434/v1"
