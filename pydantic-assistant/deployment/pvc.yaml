apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pydantic-assistant-agent-pvc
  labels:
    app: pydantic-assistant
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pydantic-assistant-input-pvc
  labels:
    app: pydantic-assistant
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pydantic-assistant-output-pvc
  labels:
    app: pydantic-assistant
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
