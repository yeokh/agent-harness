apiVersion: v1
kind: Service
metadata:
  name: pydantic-gateway
  labels:
    app: pydantic-gateway
  annotations:
    # OpenShift auto-generates a TLS cert/key into this Secret, mounted by
    # the oauth-proxy container above.
    service.alpha.openshift.io/serving-cert-secret-name: pydantic-gateway-tls
spec:
  selector:
    app: pydantic-gateway
  ports:
    - name: https
      port: 4443
      targetPort: 4443
      protocol: TCP
