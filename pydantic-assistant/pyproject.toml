[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pydantic-assistant"
version = "0.1.0"
description = "Flask + Pydantic AI assistant combining interactive Chat and autonomous Batch modes"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
    "pydantic-ai>=2.52.0",
    "httpx>=0.28.1",
]

[tool.setuptools]
py-modules = ["agent_core", "web_app"]
