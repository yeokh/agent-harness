[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pydantic-agent"
version = "0.1.0"
description = "Headless Pydantic AI agent: S3-backed one-shot job with agent/input/output folders"
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai>=2.52.0",
    "httpx>=0.28.1",
    "boto3>=1.35.0",
]

[tool.setuptools]
py-modules = ["pydantic_agent"]
