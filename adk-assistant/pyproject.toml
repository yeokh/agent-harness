[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adk-assistant"
version = "0.1.0"
description = "FastAPI + Google ADK assistant combining interactive Chat and autonomous Batch modes"
requires-python = ">=3.11"
dependencies = [
    "google-adk[mcp]>=2.11.0",
    "litellm>=1.80",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.28.1",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
otel = ["opentelemetry-exporter-otlp-proto-http>=1.30"]
dev = ["pytest>=8"]

[tool.setuptools]
py-modules = ["adk_core", "web_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::UserWarning"]
