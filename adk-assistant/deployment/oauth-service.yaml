apiVersion: v1
kind: Service
metadata:
  name: adk-assistant-oauth
  labels:
    app: adk-assistant
  annotations:
    # OpenShift service-serving-cert controller auto-generates a TLS cert/key
    # into this Secret and mounts-ready volume for the oauth-proxy container.
    service.alpha.openshift.io/serving-cert-secret-name: adk-assistant-tls
spec:
  selector:
    app: adk-assistant
  ports:
    - name: https
      port: 4443
      targetPort: 4443
      protocol: TCP
