apiVersion: apps/v1
kind: Deployment
metadata:
  name: adk-assistant
  labels:
    app: adk-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adk-assistant
  template:
    metadata:
      labels:
        app: adk-assistant
    spec:
      containers:
        - name: adk-assistant
          image: quay.io/kenghua_yeo/adk-assistant:v1
          ports:
            - containerPort: 8081
              protocol: TCP
          envFrom:
            - secretRef:
                name: adk-assistant-api-keys
          env:
            - name: API_PROVIDER
              value: "openai-compatible"
            - name: GOOGLE_CLOUD_PROJECT
              value: ""
            - name: GOOGLE_CLOUD_LOCATION
              value: "us-central1"
            - name: MODEL
              value: "llama3.2"
            - name: MAX_TURNS
              value: "20"
            - name: MAX_OUTPUT_TOKENS
              value: "16384"
            - name: ALLOW_SHELL
              value: "false"
            - name: SHELL_TIMEOUT
              value: "60"
            - name: PORT
              value: "8081"
            - name: HOST
              value: "0.0.0.0"
          volumeMounts:
            - name: agent-volume
              mountPath: /app/agent
            - name: input-volume
              mountPath: /app/input
            - name: output-volume
              mountPath: /app/output
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: agent-volume
          persistentVolumeClaim:
            claimName: adk-assistant-agent-pvc
        - name: input-volume
          persistentVolumeClaim:
            claimName: adk-assistant-input-pvc
        - name: output-volume
          persistentVolumeClaim:
            claimName: adk-assistant-output-pvc
