apiVersion: v1
kind: Secret
metadata:
  name: adk-assistant-api-keys
  labels:
    app: adk-assistant
type: Opaque
stringData:
  # Fill in only the keys for the provider(s) you plan to use. The default
  # provider, openai-compatible (local Ollama/vLLM), needs no key at all —
  # just set OPENAI_BASE_URL to point at it. Unused entries can be left blank.
  GOOGLE_API_KEY: "<your-gemini-api-key>"
  ANTHROPIC_API_KEY: "<your-anthropic-api-key>"
  OPENAI_API_KEY: "<your-openai-api-key>"
  OPENAI_COMPATIBLE_API_KEY: ""
  OPENROUTER_API_KEY: "<your-openrouter-api-key>"
  OPENAI_BASE_URL: "http://localhost:11434/v1"
