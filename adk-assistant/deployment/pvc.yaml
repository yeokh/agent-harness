apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: adk-assistant-agent-pvc
  labels:
    app: adk-assistant
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: adk-assistant-input-pvc
  labels:
    app: adk-assistant
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: adk-assistant-output-pvc
  labels:
    app: adk-assistant
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
